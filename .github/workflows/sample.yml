name: Surf Sample

on:
  schedule:
    # Every 15 min, but only during UTC hours that can fall inside the
    # sampling window. Pacific is UTC-7/-8, so sunrise-1h .. sunset+1h never
    # reaches 05:00-10:00 UTC — those ticks are not scheduled at all.
    - cron: '0,15,30,45 11-23,0-4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Sample even if outside the active window
        type: boolean
        default: false

# A delayed tick must never overlap an in-flight sample and double-write.
concurrency:
  group: surf-sample
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    # Guard against a hung capture draining the monthly Actions quota.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Runs before any dependency setup, so a tick outside the window costs
      # seconds rather than minutes. src/scheduler.py still does the
      # authoritative per-spot window check before capturing anything.
      - name: Check active window
        id: window
        env:
          FORCE_RUN: ${{ inputs.force }}
        run: python3 .github/scripts/active_window.py >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.window.outputs.active == 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        if: steps.window.outputs.active == 'true'
        run: pip install -r requirements.txt

      - name: Run sample cycle
        if: steps.window.outputs.active == 'true'
        run: python src/scheduler.py --once
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Dead man's switch (see SCHEDULING.md). Pings only when a sample was
      # attempted, so overnight no-op ticks stay silent; a failed sample pings
      # /fail so the alert fires at once instead of after the grace period.
      - name: Ping healthcheck
        if: always() && steps.window.outputs.active == 'true'
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ -z "$HC_URL" ]; then echo "HEALTHCHECK_URL not set; skipping"; exit 0; fi
          suffix=""; [ "$OUTCOME" = "success" ] || suffix="/fail"
          curl -fsS -m 10 --retry 3 -o /dev/null "$HC_URL$suffix" || echo "::warning::healthcheck ping failed"
