<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surf Crowd Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #070d1a;
      --surface:      #0d1625;
      --surface-2:    #141e30;
      --border:       rgba(255,255,255,0.06);
      --border-hover: rgba(255,255,255,0.12);
      --accent:       #38bdf8;
      --text:         #e2e8f0;
      --text-dim:     #94a3b8;
      --text-muted:   #475569;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: rgba(7,13,26,0.85);
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 0 0 rgba(52,211,153,0.4);
      animation: live-pulse 2.5s infinite;
    }
    @keyframes live-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(52,211,153,0.4); }
      70%  { box-shadow: 0 0 0 6px rgba(52,211,153,0); }
      100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
    }

    #lastUpdated {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ── Layout ──────────────────────────────────────────────────────────── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 20px 56px;
    }

    /* ── Spot Grid ───────────────────────────────────────────────────────── */
    .spots-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 40px;
    }
    @media (max-width: 680px) {
      .spots-grid { grid-template-columns: 1fr; }
    }

    /* ── Spot Card ───────────────────────────────────────────────────────── */
    .spot-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      transition: border-color 0.2s;
      perspective: 1000px;
      cursor: pointer;
    }
    .spot-card:hover {
      border-color: var(--border-hover);
    }

    /* ── Flip card mechanics ─────────────────────────────────────────────── */
    .card-inner {
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .spot-card.flipped .card-inner {
      transform: rotateY(180deg);
    }
    .card-front,
    .card-back {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .card-front {
      border-radius: 18px;
      overflow: hidden;
    }
    .card-back {
      position: absolute;
      inset: 0;
      background: var(--surface-2);
      border-radius: 18px;
      transform: rotateY(180deg);
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Back card content ───────────────────────────────────────────────── */
    .back-header { display: flex; align-items: flex-start; justify-content: space-between; }
    .back-spot-name {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
    }
    .back-title {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(255,255,255,0.06);
      padding: 2px 8px;
      border-radius: 20px;
    }
    .crowd-level-wrap { display: flex; align-items: baseline; gap: 10px; }
    .crowd-level-badge {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .crowd-level-LOW    { color: #34d399; }
    .crowd-level-NORMAL { color: #94a3b8; }
    .crowd-level-BUSY   { color: #fb923c; }
    .crowd-level-PACKED { color: #f87171; }
    .crowd-current {
      font-size: 13px;
      color: var(--text-dim);
    }
    .back-section {
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .back-section-label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .back-range {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .back-samples {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .crowd-bar-wrap {
      height: 4px;
      background: rgba(255,255,255,0.07);
      border-radius: 2px;
      margin-top: 7px;
      position: relative;
    }
    .crowd-bar-fill {
      height: 100%;
      border-radius: 2px;
      max-width: 100%;
    }
    .crowd-bar-marker {
      position: absolute;
      top: -3px;
      width: 2px;
      height: 10px;
      background: rgba(255,255,255,0.85);
      border-radius: 1px;
      transform: translateX(-50%);
    }
    .flip-hint {
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
      margin-top: auto;
      padding-top: 4px;
    }
    .back-no-data {
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
    }

    .frame-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      background: var(--surface-2);
    }
    .frame-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 12px;
      letter-spacing: 0.03em;
    }

    .card-body { padding: 18px 20px 20px; }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .spot-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .rating-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .r-EPIC        { background: rgba(251,191,36,0.15);  color: #fbbf24; }
    .r-VERY_GOOD   { background: rgba(52,211,153,0.15);  color: #34d399; }
    .r-GOOD        { background: rgba(52,211,153,0.10);  color: #6ee7b7; }
    .r-FAIR        { background: rgba(251,191,36,0.10);  color: #fcd34d; }
    .r-POOR_TO_FAIR{ background: rgba(251,146,60,0.10);  color: #fb923c; }
    .r-POOR        { background: rgba(248,113,113,0.10); color: #f87171; }

    /* ── Count display ───────────────────────────────────────────────────── */
    .count-row {
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin-bottom: 4px;
    }
    .count-num {
      font-size: 64px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
    }
    .count-num.known    { color: var(--text); }
    .count-num.unknown  { color: var(--text-muted); font-size: 48px; }
    .count-unit {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 400;
    }
    .count-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 18px;
      min-height: 16px;
    }

    /* ── Conditions ──────────────────────────────────────────────────────── */
    .conditions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .cond-label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .cond-value {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
    }
    .cond-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ── Vision conditions ───────────────────────────────────────────────── */
    .vision-conditions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding-top: 10px;
      margin-top: 10px;
      border-top: 1px solid var(--border);
    }
    .vision-notes {
      font-size: 11px;
      color: var(--text-muted);
      font-style: italic;
      padding-top: 8px;
      line-height: 1.4;
    }

    /* ── Skeleton ────────────────────────────────────────────────────────── */
    .skeleton {
      background: linear-gradient(90deg,
        var(--surface-2) 25%,
        rgba(255,255,255,0.04) 50%,
        var(--surface-2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 5px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Section header ──────────────────────────────────────────────────── */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    /* ── Chart card ──────────────────────────────────────────────────────── */
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px 20px 24px;
    }
    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .chart-title {
      font-size: 13px;
      color: var(--text-dim);
    }

    .range-tabs {
      display: flex;
      gap: 3px;
      background: var(--surface-2);
      border-radius: 8px;
      padding: 3px;
    }
    .range-tab {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 11px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-muted);
      border: none;
      background: transparent;
      transition: all 0.15s;
    }
    .range-tab:hover  { color: var(--text-dim); }
    .range-tab.active { background: var(--surface); color: var(--text); }

    /* ── Popular Times (card back) ───────────────────────────────────────── */
    .pt-section { padding-top: 16px; border-top: 1px solid var(--border); }
    .pt-day-name {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 3px;
    }
    .pt-header {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 10px;
      min-height: 14px;
    }
    .pt-chart {
      display: flex;
      align-items: stretch;
      gap: 2px;
      height: 120px;
    }
    .pt-bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      cursor: pointer;
    }
    .pt-bar {
      width: 100%;
      border-radius: 3px 3px 0 0;
      min-height: 2px;
      transition: opacity 0.15s;
    }
    .pt-bar-col.future .pt-bar { opacity: 0.35; }
    .pt-bar-col.current .pt-bar {
      outline: 1px solid rgba(255,255,255,0.5);
      outline-offset: 1px;
    }
    .pt-bar-col.no-data .pt-bar { background: rgba(255,255,255,0.08) !important; }
    .pt-axis {
      display: flex;
      gap: 2px;
      margin-top: 4px;
    }
    .pt-axis-label {
      flex: 1;
      font-size: 8px;
      color: var(--text-muted);
      text-align: center;
      visibility: hidden;
    }
    .pt-axis-label.show    { visibility: visible; }
    .pt-axis-label.current { color: var(--accent); visibility: visible; }
    .pt-dots {
      display: flex;
      justify-content: center;
      gap: 7px;
      padding: 10px 0 2px;
    }
    .pt-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }
    .pt-dot:hover  { background: rgba(255,255,255,0.38); }
    .pt-dot.active { background: var(--accent); transform: scale(1.25); }
    .pt-dot.active:hover { background: var(--accent); }
    .pt-callout {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border-hover);
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 10px;
      color: var(--text);
      white-space: nowrap;
      z-index: 5;
      pointer-events: none;
      text-align: center;
      line-height: 1.5;
    }
    .pt-bar-col:hover .pt-callout,
    .pt-bar-col.tapped .pt-callout { display: block; }

    /* ── Heatmap (bottom section) ─────────────────────────────────────────── */
    .hm-grid-wrap { overflow-x: auto; }
    .hm-grid {
      display: grid;
      /* columns set inline by JS: [label] repeat(N, 1fr) */
      gap: 3px;
      min-width: 0;
    }
    .hm-spot-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      text-align: right;
      padding-right: 8px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      white-space: nowrap;
    }
    .hm-cell {
      height: 22px;
      border-radius: 3px;
      cursor: default;
      transition: transform 0.1s, filter 0.1s;
      position: relative;
    }
    .hm-cell:hover {
      transform: scale(1.15);
      filter: brightness(1.3);
      z-index: 2;
    }
    /* CSS tooltip via data-tip */
    .hm-cell::after {
      content: attr(data-tip);
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border-hover);
      border-radius: 7px;
      padding: 5px 9px;
      font-size: 10px;
      color: var(--text);
      white-space: pre;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      line-height: 1.6;
    }
    .hm-cell:hover::after { display: block; }
    /* keep tooltip on screen at edges */
    .hm-cell:first-child::after { left: 0; transform: none; }
    .hm-cell:last-child::after  { left: auto; right: 0; transform: none; }
    .hm-date-label {
      font-size: 9px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.4;
      min-width: 0;
      overflow: hidden;
    }
    .hm-date-label.today { color: var(--accent); }
    .hm-spacer { /* fills label column in date row */ }
    .hm-legend {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .hm-legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 9px;
      color: var(--text-muted);
    }
    .hm-legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="live-dot"></div>
    Surf Crowd Monitor
  </div>
  <div id="lastUpdated">—</div>
</header>

<main>
  <div class="spots-grid" id="spotsGrid">
    <!-- skeleton injected by JS on load -->
  </div>

  <div class="section-label">Crowd History</div>
  <div class="chart-card">
    <div class="chart-header">
      <div class="chart-title">All spots · avg daily surfers</div>
      <div class="range-tabs" id="heatmapTabs">
        <button class="range-tab active" data-days="7">7 d</button>
        <button class="range-tab" data-days="30">30 d</button>
      </div>
    </div>
    <div class="hm-grid-wrap">
      <div id="heatmapGrid"></div>
    </div>
    <div id="heatmapLegend" class="hm-legend"></div>
  </div>
</main>

<script>
// ── CONFIG — fill in your Supabase anon (public) key ───────────────────────
const SUPABASE_URL      = 'https://htqizzhtueybtqbwcmiq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0cWl6emh0dWV5YnRxYndjbWlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwNTk5MzQsImV4cCI6MjA4OTYzNTkzNH0.7ezUGo82i6iHs3K9OsPzHuKzgUeENVahI7b_839Dha4';

// Spots and colors are loaded dynamically from spots.json (symlinked to config/spots.json).
// To add a new spot, edit config/spots.json — no dashboard changes needed.
// Cards render in file order, which is kept north to south.
let SPOTS  = [];
const PALETTE = [
  '#38bdf8','#818cf8','#f472b6','#fb923c',
  '#34d399','#a78bfa','#fbbf24','#f87171',
  '#2dd4bf','#e879f9','#a3e635','#60a5fa',
  '#fda4af','#fdba74','#c4b5fd','#94a3b8',
  '#86efac','#67e8f9','#fcd34d',
];
let COLORS = {};

async function loadSpots() {
  const res  = await fetch('spots.json');
  const json = await res.json();
  SPOTS  = json.spots
    .filter(s => s.enabled)
    .map(s => ({ id: s.id, name: s.name, surflineId: s.surfline_spot_id }));
  COLORS = Object.fromEntries(
    SPOTS.map((s, i) => [s.id, PALETTE[i % PALETTE.length]])
  );
}

// ── Init Supabase ──────────────────────────────────────────────────────────
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let activeDays = 7;

// ── Helpers ────────────────────────────────────────────────────────────────
function timeAgo(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 90)    return 'just now';
  if (s < 3600)  return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}

function ratingKey(r) {
  return r ? r.replace(/\s+/g, '_').toUpperCase() : '';
}
function ratingLabel(r) {
  return r ? r.replace(/_/g, ' ') : '';
}
function fmt(v, unit, decimals = 0) {
  return v != null ? `${Number(v).toFixed(decimals)}${unit}` : '—';
}
function waveRange(mn, mx) {
  if (mn == null || mx == null) return '—';
  return mn === mx ? `${mn}ft` : `${mn}–${mx}ft`;
}
function degreesToCardinal(deg) {
  if (deg == null) return '';
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg / 22.5) % 16];
}

// ── Skeleton cards ─────────────────────────────────────────────────────────
function renderSkeletons() {
  document.getElementById('spotsGrid').innerHTML = SPOTS.map(() => `
    <div class="spot-card">
      <div class="card-inner">
        <div class="card-front">
          <div class="frame-placeholder skeleton"></div>
          <div class="card-body">
            <div class="card-header">
              <div class="skeleton" style="width:90px;height:11px"></div>
              <div class="skeleton" style="width:38px;height:18px;border-radius:20px"></div>
            </div>
            <div class="skeleton" style="width:72px;height:60px;margin-bottom:6px"></div>
            <div class="skeleton" style="width:110px;height:11px;margin-bottom:18px"></div>
            <div class="conditions">
              ${[0,1,2,3].map(() => `
                <div>
                  <div class="skeleton" style="height:9px;margin-bottom:4px;width:60%"></div>
                  <div class="skeleton" style="height:13px;width:80%"></div>
                </div>`).join('')}
            </div>
          </div>
        </div>
        <div class="card-back">
          <div class="back-no-data" style="margin:auto;text-align:center">Loading…</div>
        </div>
      </div>
    </div>
  `).join('');
}

// ── Format vision enum values (snake_case → Title Case) ───────────────────
function fmtVision(val) {
  if (!val) return '—';
  const overrides = { over_head: 'Overhead+' };
  if (overrides[val]) return overrides[val];
  return val.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

// ── Render a single card ───────────────────────────────────────────────────
function cardHTML(spot, obs, cond = {}) {
  const count    = obs?.surfer_count;
  const reliable = obs?.count_reliable;
  // Prefer live conditions (cond), fall back to stored DB values (obs)
  const rk       = ratingKey(cond?.spot_rating ?? obs?.spot_rating);

  const frameHTML = obs?.frame_url
    ? `<img class="frame-thumb" src="${obs.frame_url}" alt="${spot.name}" loading="lazy">`
    : `<div class="frame-placeholder">No frame yet</div>`;

  let countHTML, unitHTML, metaHTML;
  if (!obs) {
    countHTML = `<div class="count-num unknown">—</div>`;
    unitHTML  = '';
    metaHTML  = 'No data';
  } else if (count === null || !reliable) {
    countHTML = `<div class="count-num unknown">—</div>`;
    unitHTML  = '';
    metaHTML  = `Unreliable · ${timeAgo(obs.captured_at)}`;
  } else {
    countHTML = `<div class="count-num known">${count}</div>`;
    unitHTML  = `<div class="count-unit">surfers</div>`;
    metaHTML  = `Counted ${timeAgo(obs.captured_at)}`;
  }

  return `
    <div class="spot-card" data-spot-id="${spot.id}">
      <div class="card-inner">
        <div class="card-front">
          ${frameHTML}
          <div class="card-body">
            <div class="card-header">
              <div class="spot-name">${spot.name}</div>
              ${rk ? `<div class="rating-badge r-${rk}">${ratingLabel(cond?.spot_rating ?? obs?.spot_rating)}</div>` : ''}
            </div>
            <div class="count-row">${countHTML}${unitHTML}</div>
            <div class="count-meta">${metaHTML}</div>
            <div class="conditions">
              <div>
                <div class="cond-label">Surf</div>
                <div class="cond-value">${waveRange(
                  cond?.wave_height_min ?? obs?.wave_height_min,
                  cond?.wave_height_max ?? obs?.wave_height_max
                )}</div>
                ${(cond?.surf_human_relation) ? `<div class="cond-sub">${cond.surf_human_relation}</div>` : ''}
              </div>
              <div>
                <div class="cond-label">Swell</div>
                <div class="cond-value">${(() => {
                  const h   = cond?.swell_height      ?? obs?.swell_height;
                  const p   = cond?.swell_period      ?? obs?.swell_period;
                  const dir = degreesToCardinal(cond?.swell_direction ?? obs?.swell_direction);
                  if (h == null || h < 0.1) return '—';
                  return `${Number(h).toFixed(1)}ft${p ? ` @ ${p}s` : ''}${dir ? ` ${dir}` : ''}`;
                })()}</div>
              </div>
              <div>
                <div class="cond-label">Wind</div>
                <div class="cond-value">${(() => {
                  const s   = cond?.wind_speed         ?? obs?.wind_speed;
                  const dir = cond?.wind_direction_type ?? null;
                  if (s == null) return '—';
                  return `${Math.round(s)} kts${dir ? ` · ${dir}` : ''}`;
                })()}</div>
              </div>
              <div>
                <div class="cond-label">Tide</div>
                <div class="cond-value">${fmt(cond?.tide_height ?? obs?.tide_height, 'ft', 1)}</div>
              </div>
            </div>
            ${(() => {
              const surf  = obs?.vision_surface;
              const qual  = obs?.vision_wave_quality;
              const clar  = obs?.vision_water_clarity;
              const vis   = obs?.vision_visibility;
              const notes = obs?.vision_conditions_notes;
              if (!surf && !qual && !clar && !vis && !notes) return '';
              return `
            <div class="vision-conditions">
              <div>
                <div class="cond-label">Surface</div>
                <div class="cond-value">${fmtVision(surf)}</div>
              </div>
              <div>
                <div class="cond-label">Quality</div>
                <div class="cond-value">${fmtVision(qual)}</div>
              </div>
              <div>
                <div class="cond-label">Clarity</div>
                <div class="cond-value">${fmtVision(clar)}</div>
              </div>
              <div>
                <div class="cond-label">Visibility</div>
                <div class="cond-value">${fmtVision(vis)}</div>
              </div>

            })()}
          </div>
        </div>
        <div class="card-back">

// ── Live conditions via Supabase Edge Function (proxies Surfline server-side)
const _CONDITIONS_FN = `${SUPABASE_URL}/functions/v1/conditions`;

async function fetchSpotConditions(surflineId) {
  try {
    const r = await fetch(`${_CONDITIONS_FN}?spotId=${surflineId}`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } catch (e) {
    console.warn('Conditions fetch failed for', surflineId, e);
    return {};
  }
}

// ── Crowd context — historical typical data ────────────────────────────────

const backDataCache = new Map(); // spotId → { rows, loaded }

// Compute percentile stats from an array of numbers
function computeStats(samples) {
  if (samples.length < 5) return null;
  const sorted = [...samples].sort((a, b) => a - b);
  const at = pct => sorted[Math.max(0, Math.floor((pct / 100) * sorted.length) - 1)];
  return {
    count:  samples.length,
    min:    sorted[0],
    max:    sorted[sorted.length - 1],
    p25:    at(25),
    p75:    at(75),
    p90:    at(90),
    mean:   Math.round(samples.reduce((s, v) => s + v, 0) / samples.length),
  };
}

// Fetch last-30-days reliable rows for a spot (cached per spotId)
async function fetchHistoricalRows(spotId) {
  if (backDataCache.has(spotId)) return backDataCache.get(spotId);
  const since = new Date(Date.now() - 30 * 86_400_000).toISOString();
  const { data } = await db
    .from('observations')
    .select('captured_at, surfer_count, spot_rating, wave_height_min')
    .eq('spot_id', spotId)
    .eq('count_reliable', true)
    .not('surfer_count', 'is', null)
    .gte('captured_at', since)
    .order('captured_at', { ascending: false });
  const rows = data || [];
  backDataCache.set(spotId, rows);
  return rows;
}

// Typical crowd for same ±1 hour of day (browser local time)
function typicalByHour(rows, refDate) {
  const refHour = refDate.getHours();
  const matching = rows.filter(r => {
    const h = new Date(r.captured_at).getHours();
    return Math.abs(h - refHour) <= 1 || Math.abs(h - refHour) >= 23; // wrap midnight
  });
  return computeStats(matching.map(r => r.surfer_count));
}

// Typical crowd for same Surfline rating
function typicalByRating(rows, rating) {
  if (!rating) return null;
  const matching = rows.filter(r => r.spot_rating === rating && r.surfer_count != null);
  return computeStats(matching.map(r => r.surfer_count));
}

// Classify current count against a stats object
function classifyLevel(current, stats) {
  if (!stats || current == null) return null;
  if (current <= stats.p25)  return 'LOW';
  if (current <= stats.p75)  return 'NORMAL';
  if (current <= stats.p90)  return 'BUSY';
  return 'PACKED';
}

// Mini horizontal bar: filled to p75, marker at current position
function barHTML(current, stats, color) {
  if (!stats || current == null) return '';
  const maxVal   = Math.max(stats.max, current, 1);
  const fillPct  = Math.min(100, (stats.p75 / maxVal) * 100);
  const markPct  = Math.min(100, (current  / maxVal) * 100);
  return `
    <div class="crowd-bar-wrap">
      <div class="crowd-bar-fill" style="width:${fillPct}%;background:${color}33"></div>
      <div class="crowd-bar-marker" style="left:${markPct}%"></div>
    </div>`;
}

function formatHour(h) {
  const ampm = h < 12 ? 'am' : 'pm';
  const h12  = h % 12 || 12;
  return `${h12}${ampm}`;
}

// ── Popular Times ───────────────────────────────────────────────────────────

// Group rows by (day-of-week, hour) for hours 5–19
function computeHourlyAvgsByDay(rows) {
  const acc = {};
  for (let d = 0; d < 7; d++) {
    acc[d] = {};
    for (let h = 5; h <= 19; h++) acc[d][h] = { sum: 0, count: 0 };
  }
  for (const r of rows) {
    const dt  = new Date(r.captured_at);
    const dow = dt.getDay();
    const h   = dt.getHours();
    if (h < 5 || h > 19) continue;
    acc[dow][h].sum   += r.surfer_count;
    acc[dow][h].count += 1;
  }
  const result = {};
  for (let d = 0; d < 7; d++) {
    result[d] = [];
    for (let h = 5; h <= 19; h++) {
      const { sum, count } = acc[d][h];
      result[d].push({ hour: h, avg: count > 0 ? sum / count : null, count });
    }
  }
  return result;
}

const PT_DAYS      = ['Su','Mo','Tu','We','Th','Fr','Sa'];
const PT_BAR_COLOR = 'rgba(56,189,248,0.65)';

function formatHour12(h) {
  const suffix = h < 12 ? 'AM' : 'PM';
  const h12    = h % 12 || 12;
  return `${h12} ${suffix}`;
}

function formatHourShort(h) {
  const suffix = h < 12 ? 'a' : 'p';
  const h12    = h % 12 || 12;
  return `${h12}${suffix}`;
}

// 5-tier crowd label relative to the day's distribution
function popularTimesLabel(focusedAvg, dayAvgs) {
  const vals = dayAvgs.filter(x => x.avg !== null).map(x => x.avg);
  if (!vals.length || focusedAvg === null) return '';
  const sorted = [...vals].sort((a, b) => a - b);
  const pct = p => sorted[Math.max(0, Math.floor((p / 100) * sorted.length) - 1)];
  if (focusedAvg === 0 || focusedAvg <= pct(5))  return 'Usually empty';
  if (focusedAvg <= pct(30))                      return 'Usually not too busy';
  if (focusedAvg <= pct(60))                      return 'Usually moderately busy';
  if (focusedAvg <= pct(85))                      return 'Usually pretty crowded';
  return 'Usually packed';
}

// Build bar chart + axis row (re-used when switching days)
function renderPTChart(dayAvgs, selectedDay, currentHour, isToday) {
  const maxAvg      = Math.max(1, ...dayAvgs.map(x => x.avg ?? 0));
  const showLabelAt = new Set([5, 7, 9, 11, 13, 15, 17, 19]);

  const barCols = dayAvgs.map(({ hour, avg, count }) => {
    const heightPct = avg !== null ? Math.max(4, (avg / maxAvg) * 100) : 0;
    const noData    = avg === null;
    const isCurrent = isToday && hour === currentHour;
    const isFuture  = isToday && hour > currentHour;
    const classes   = [
      'pt-bar-col',
      noData    ? 'no-data'  : '',
      isCurrent ? 'current'  : '',
      isFuture  ? 'future'   : '',
    ].filter(Boolean).join(' ');

    const callout = noData
      ? `${formatHour12(hour)}<br><span style="color:var(--text-muted)">No data</span>`
      : `${formatHour12(hour)}<br><span style="color:var(--text-dim)">Avg ${Math.round(avg)} surfer${Math.round(avg) !== 1 ? 's' : ''} · ${count} sample${count !== 1 ? 's' : ''}</span>`;

    return `<div class="${classes}" data-hour="${hour}" data-avg="${avg ?? ''}" data-count="${count}">
      <div class="pt-bar" style="height:${heightPct}%;background:${noData ? '' : PT_BAR_COLOR}"></div>
      <div class="pt-callout">${callout}</div>
    </div>`;
  }).join('');

  const axisLabels = dayAvgs.map(({ hour }) => {
    const isCurrent = isToday && hour === currentHour;
    const cls = ['pt-axis-label',
      isCurrent ? 'current' : (showLabelAt.has(hour) ? 'show' : ''),
    ].filter(Boolean).join(' ');
    return `<div class="${cls}">${formatHourShort(hour)}</div>`;
  }).join('');

  return `<div class="pt-chart">${barCols}</div><div class="pt-axis">${axisLabels}</div>`;
}

const PT_FULL_DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

// Full Popular Times section HTML (day name + label + chart + dots)
function renderPopularTimesHTML(hourlyByDay, selectedDay, currentHour) {
  const today   = new Date().getDay();
  const isToday = selectedDay === today;
  const dayAvgs = hourlyByDay[selectedDay] || [];

  const focusHour  = isToday ? Math.max(5, Math.min(19, currentHour)) : 12;
  const focusEntry = dayAvgs.find(x => x.hour === focusHour);
  const crowdLabel = popularTimesLabel(focusEntry?.avg ?? null, dayAvgs);
  const labelText  = crowdLabel ? `${formatHour12(focusHour)}: ${crowdLabel}` : '';

  const dots = PT_DAYS.map((d, i) =>
    `<div class="pt-dot${i === selectedDay ? ' active' : ''}" data-day="${i}" title="${PT_FULL_DAYS[i]}"></div>`
  ).join('');

  return `
    <div class="pt-day-name">${PT_FULL_DAYS[selectedDay]}</div>
    <div class="pt-header">${labelText}</div>
    ${renderPTChart(dayAvgs, selectedDay, currentHour, isToday)}
    <div class="pt-dots">${dots}</div>`;
}

// Render full back-card HTML
function renderBackHTML(spot, obs, hourlyByDay, hourStats, condStats) {
  const count    = obs?.surfer_count;
  const rating   = obs?.spot_rating;
  const currentHour = new Date().getHours();
  const currentDay  = new Date().getDay();

  // Level badge (uses ±1hr stats for context)
  const primaryStats = hourStats || condStats;
  const level       = classifyLevel(count, primaryStats);
  const levelColors = { LOW: '#34d399', NORMAL: '#94a3b8', BUSY: '#fb923c', PACKED: '#f87171' };

  const badgeHTML = (level && count != null)
    ? `<div class="crowd-level-wrap">
        <div class="crowd-level-badge crowd-level-${level}">${level}</div>
        <div class="crowd-current">Currently ${count} surfer${count !== 1 ? 's' : ''}</div>
       </div>`
    : `<div class="back-no-data">No recent count to compare</div>`;

  // Popular Times section
  const ptSection = `
    <div class="pt-section" data-selected-day="${currentDay}">
      <div class="back-section-label">Popular times · last 30 days</div>
      ${renderPopularTimesHTML(hourlyByDay, currentDay, currentHour)}
    </div>`;

  // Conditions section
  let condSection = '';
  const condLevel = classifyLevel(count, condStats);
  const condColor = condLevel ? levelColors[condLevel] : '#94a3b8';
  if (condStats && rating) {
    condSection = `
      <div class="back-section">
        <div class="back-section-label">Similar conditions (${ratingLabel(rating)} surf)</div>
        <div class="back-range">${condStats.p25}–${condStats.p75} surfers typical</div>
        <div class="back-samples">${condStats.count} sample${condStats.count !== 1 ? 's' : ''} · last 30 days</div>
        ${barHTML(count, condStats, condColor)}
      </div>`;
  } else if (rating) {
    condSection = `
      <div class="back-section">
        <div class="back-section-label">Similar conditions (${ratingLabel(rating)} surf)</div>
        <div class="back-no-data">Not enough history yet</div>
      </div>`;
  }

  return `
    <div class="back-header">
      <div class="back-spot-name">${spot.name}</div>
      <div class="back-title">Crowd Context</div>
    </div>
    ${badgeHTML}
    ${ptSection}
    ${condSection}
    <div class="flip-hint">↩ Tap to flip back</div>`;
}

// Populate back face on first flip
async function ensureBackLoaded(cardEl) {
  const back = cardEl.querySelector('.card-back');
  if (back.dataset.loaded) return;

  const spotId = cardEl.dataset.spotId;
  const spot   = SPOTS.find(s => s.id === spotId);
  if (!spot) return;

  // Find the latest obs stored on the card (we stash it as a data attribute)
  let obs = null;
  try { obs = JSON.parse(cardEl.dataset.obs || 'null'); } catch (_) {}

  try {
    const rows        = await fetchHistoricalRows(spotId);
    const refDate     = obs?.captured_at ? new Date(obs.captured_at) : new Date();
    const rating      = obs?.spot_rating ?? null;
    const hourlyByDay = computeHourlyAvgsByDay(rows);
    const hourStats   = typicalByHour(rows, refDate);
    const condStats   = typicalByRating(rows, rating);
    back.innerHTML    = renderBackHTML(spot, obs, hourlyByDay, hourStats, condStats);
    back.dataset.ptByDay = JSON.stringify(hourlyByDay);
  } catch (e) {
    console.warn('Back card load failed', e);
    back.innerHTML = `<div class="back-no-data" style="margin:auto;text-align:center">Could not load crowd data</div>`;
  }
  back.dataset.loaded = '1';
}

// ── Crowd Heatmap ──────────────────────────────────────────────────────────

const HM_TIERS = [
  { max: 0,        color: 'rgba(56,189,248,0.10)', label: 'Empty'    },
  { max: 5,        color: 'rgba(56,189,248,0.28)', label: 'Low'      },
  { max: 12,       color: 'rgba(56,189,248,0.52)', label: 'Moderate' },
  { max: 20,       color: 'rgba(56,189,248,0.76)', label: 'Busy'     },
  { max: Infinity, color: 'rgba(56,189,248,1.00)', label: 'Packed'   },
];

function hmTier(avg) {
  return HM_TIERS.find(t => avg <= t.max) || HM_TIERS[HM_TIERS.length - 1];
}

function localDateStr(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

async function fetchHeatmapData(days) {
  // Server-side aggregation via RPC — avoids the 1000-row PostgREST limit that
  // caused recent days to be silently dropped when querying raw observation rows.
  // Returns at most (spots × days) rows, e.g. 10 × 30 = 300.
  const { data } = await db.rpc('heatmap_daily_avg', { p_days: days });

  // Build Map<spotId, Map<dateStr, avgCount>> — same shape renderHeatmap expects.
  const result = new Map();
  for (const row of (data || [])) {
    if (!result.has(row.spot_id)) result.set(row.spot_id, new Map());
    result.get(row.spot_id).set(row.date_str, row.avg_count);
  }
  return result;
}

function renderHeatmap(heatData, days) {
  const DAY_ABBR = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const today    = new Date();
  const todayStr = localDateStr(today);

  const dates = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    dates.push(d);
  }

  const gridCols = `120px repeat(${dates.length}, 1fr)`;
  let html = `<div class="hm-grid" style="grid-template-columns:${gridCols}">`;

  for (const spot of SPOTS) {
    const spotData = heatData.get(spot.id) || new Map();
    html += `<div class="hm-spot-label">${spot.name}</div>`;
    for (const date of dates) {
      const dateStr    = localDateStr(date);
      const avg        = spotData.get(dateStr);
      const isToday    = dateStr === todayStr;
      const hasData    = avg !== undefined;
      const displayDate = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

      let cellColor, tipText;
      if (!hasData) {
        cellColor = 'rgba(255,255,255,0.07)';
        tipText   = `No data on ${displayDate}`;
      } else {
        const tier = hmTier(avg);
        cellColor  = tier.color;
        tipText    = `${avg} surfer${avg !== 1 ? 's' : ''} avg. on ${displayDate}`;
      }

      const border = isToday ? 'box-shadow:0 0 0 1px rgba(56,189,248,0.6);' : '';
      html += `<div class="hm-cell" style="background:${cellColor};${border}" data-tip="${spot.name}&#10;${tipText}"></div>`;
    }
  }

  // Date label row
  html += `<div class="hm-spacer"></div>`;
  for (const date of dates) {
    const isToday = localDateStr(date) === todayStr;
    html += `<div class="hm-date-label${isToday ? ' today' : ''}">${date.getDate()}<br>${DAY_ABBR[date.getDay()]}</div>`;
  }

  html += `</div>`;
  return html;
}

function renderHeatmapLegend() {
  return HM_TIERS.map(({ color, label }) =>
    `<div class="hm-legend-item">
      <div class="hm-legend-swatch" style="background:${color}"></div>
      ${label}
    </div>`
  ).join('');
}

async function fetchAndRenderHeatmap(days) {
  const gridEl = document.getElementById('heatmapGrid');
  const legEl  = document.getElementById('heatmapLegend');
  gridEl.innerHTML = `<div style="padding:20px 0;color:var(--text-muted);font-size:12px">Loading…</div>`;
  const heatData   = await fetchHeatmapData(days);
  gridEl.innerHTML = renderHeatmap(heatData, days);
  legEl.innerHTML  = renderHeatmapLegend();
}

// ── Fetch latest observation per spot ─────────────────────────────────────
async function fetchLatest() {
  const results = await Promise.all(
    SPOTS.map(async spot => {
      const [{ data }, cond] = await Promise.all([
        db
          .from('observations')
          .select('*')
          .eq('spot_id', spot.id)
          .order('captured_at', { ascending: false })
          .limit(1)
          .maybeSingle(),
        fetchSpotConditions(spot.surflineId),
      ]);
      return { spot, obs: data, cond };
    })
  );

  document.getElementById('spotsGrid').innerHTML =
    results.map(({ spot, obs, cond }) => cardHTML(spot, obs, cond)).join('');

  // Stash obs on each card element so the back-card loader can read it
  results.forEach(({ spot, obs }) => {
    const el = document.querySelector(`.spot-card[data-spot-id="${spot.id}"]`);
    if (el && obs) {
      el.dataset.obs = JSON.stringify(obs);
      // Invalidate cached back so it re-renders on next flip with fresh obs
      const back = el.querySelector('.card-back');
      if (back) delete back.dataset.loaded;
    }
  });

  document.getElementById('lastUpdated').textContent =
    `Updated ${new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Los_Angeles' })} PT`;
}

// ── Heatmap range tab switcher ─────────────────────────────────────────────
document.getElementById('heatmapTabs').addEventListener('click', e => {
  const btn = e.target.closest('.range-tab');
  if (!btn) return;
  document.querySelectorAll('#heatmapTabs .range-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeDays = parseInt(btn.dataset.days);
  fetchAndRenderHeatmap(activeDays);
});

// ── Popular Times day switching ─────────────────────────────────────────────
function _switchPTDay(section, back, newDay) {
  const currentHour = new Date().getHours();
  const today       = new Date().getDay();
  const isToday     = newDay === today;
  const hourlyByDay = JSON.parse(back.dataset.ptByDay || '{}');
  const dayAvgs     = hourlyByDay[newDay] || [];

  section.dataset.selectedDay = newDay;

  // Update dots
  section.querySelectorAll('.pt-dot').forEach(d =>
    d.classList.toggle('active', parseInt(d.dataset.day) === newDay)
  );

  // Update day name
  const nameEl = section.querySelector('.pt-day-name');
  if (nameEl) nameEl.textContent = PT_FULL_DAYS[newDay];

  // Replace chart + axis in one shot
  const oldChart = section.querySelector('.pt-chart');
  const oldAxis  = section.querySelector('.pt-axis');
  const tmp      = document.createElement('div');
  tmp.innerHTML  = renderPTChart(dayAvgs, newDay, currentHour, isToday);
  if (oldChart) oldChart.replaceWith(tmp.children[0]);  // moves chart out of tmp
  if (oldAxis)  oldAxis.replaceWith(tmp.children[0]);   // now [0] is the axis

  // Update crowd label
  const focusHour  = isToday ? Math.max(5, Math.min(19, currentHour)) : 12;
  const focusEntry = dayAvgs.find(x => x.hour === focusHour);
  const label      = popularTimesLabel(focusEntry?.avg ?? null, dayAvgs);
  const headerEl   = section.querySelector('.pt-header');
  if (headerEl) headerEl.textContent = label ? `${formatHour12(focusHour)}: ${label}` : '';
}

function _updatePTLabel(section, barCol) {
  const back = barCol.closest('.card-back');
  if (!back) return;
  const day         = parseInt(section.dataset.selectedDay ?? new Date().getDay());
  const hourlyByDay = JSON.parse(back.dataset.ptByDay || '{}');
  const dayAvgs     = hourlyByDay[day] || [];
  const hour        = parseInt(barCol.dataset.hour);
  const rawAvg      = barCol.dataset.avg;
  const avg         = rawAvg !== '' ? parseFloat(rawAvg) : null;
  const label       = popularTimesLabel(avg, dayAvgs);
  const headerEl    = section.querySelector('.pt-header');
  if (headerEl) headerEl.textContent = label ? `${formatHour12(hour)}: ${label}` : '';
}

// ── Flip card + Popular Times event delegation ─────────────────────────────
function setupFlipHandler() {
  const grid = document.getElementById('spotsGrid');

  // Click delegation
  grid.addEventListener('click', async e => {
    // Dot click — switch day
    const dot = e.target.closest('.pt-dot');
    if (dot) {
      e.stopPropagation();
      const section = dot.closest('.pt-section');
      const back    = dot.closest('.card-back');
      _switchPTDay(section, back, parseInt(dot.dataset.day));
      return;
    }

    // Bar-col click (mobile tap to show callout + update label)
    const barCol = e.target.closest('.pt-bar-col');
    if (barCol) {
      e.stopPropagation();
      const section = barCol.closest('.pt-section');
      if (!section) return;
      section.querySelectorAll('.pt-bar-col.tapped').forEach(c => { if (c !== barCol) c.classList.remove('tapped'); });
      barCol.classList.toggle('tapped');
      _updatePTLabel(section, barCol);
      return;
    }

    // Default: flip card
    const card = e.target.closest('.spot-card[data-spot-id]');
    if (!card) return;
    card.classList.toggle('flipped');
    if (card.classList.contains('flipped')) await ensureBackLoaded(card);
  });

  // Bar hover → update crowd label (desktop)
  grid.addEventListener('mouseover', e => {
    const barCol = e.target.closest('.pt-bar-col');
    if (!barCol || barCol.classList.contains('no-data')) return;
    const section = barCol.closest('.pt-section');
    if (!section) return;
    _updatePTLabel(section, barCol);
  });

  // Swipe left/right on pt-section to change day
  let ptSwipeX = 0;
  grid.addEventListener('touchstart', e => {
    if (e.target.closest('.pt-section')) ptSwipeX = e.touches[0].clientX;
  }, { passive: true });
  grid.addEventListener('touchend', e => {
    const section = e.target.closest('.pt-section');
    if (!section) return;
    const dx = e.changedTouches[0].clientX - ptSwipeX;
    if (Math.abs(dx) < 30) return;
    const back    = section.closest('.card-back');
    const cur     = parseInt(section.dataset.selectedDay ?? new Date().getDay());
    const newDay  = dx < 0 ? (cur + 1) % 7 : (cur + 6) % 7;
    _switchPTDay(section, back, newDay);
  }, { passive: true });
}

// ── Boot ───────────────────────────────────────────────────────────────────
async function init() {
  await loadSpots();
  renderSkeletons();
  setupFlipHandler();
  await Promise.all([fetchLatest(), fetchAndRenderHeatmap(activeDays)]);
}

init();
setInterval(fetchLatest, 5 * 60 * 1000); // auto-refresh cards every 5 min
</script>
