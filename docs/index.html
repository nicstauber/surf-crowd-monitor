<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surf Crowd Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #070d1a;
      --surface:      #0d1625;
      --surface-2:    #141e30;
      --border:       rgba(255,255,255,0.06);
      --border-hover: rgba(255,255,255,0.12);
      --accent:       #38bdf8;
      --text:         #e2e8f0;
      --text-dim:     #94a3b8;
      --text-muted:   #475569;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: rgba(7,13,26,0.85);
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 0 0 rgba(52,211,153,0.4);
      animation: live-pulse 2.5s infinite;
    }
    @keyframes live-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(52,211,153,0.4); }
      70%  { box-shadow: 0 0 0 6px rgba(52,211,153,0); }
      100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
    }

    #lastUpdated {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ── Layout ──────────────────────────────────────────────────────────── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 20px 56px;
    }

    /* ── Spot Grid ───────────────────────────────────────────────────────── */
    .spots-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 40px;
    }
    @media (max-width: 680px) {
      .spots-grid { grid-template-columns: 1fr; }
    }

    /* ── Spot Card ───────────────────────────────────────────────────────── */
    .spot-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      transition: border-color 0.2s;
      perspective: 1000px;
      cursor: pointer;
    }
    .spot-card:hover {
      border-color: var(--border-hover);
    }

    /* ── Flip card mechanics ─────────────────────────────────────────────── */
    .card-inner {
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .spot-card.flipped .card-inner {
      transform: rotateY(180deg);
    }
    .card-front,
    .card-back {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .card-front {
      border-radius: 18px;
      overflow: hidden;
    }
    .card-back {
      position: absolute;
      inset: 0;
      background: var(--surface-2);
      border-radius: 18px;
      transform: rotateY(180deg);
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── Back card content ───────────────────────────────────────────────── */
    .back-header { display: flex; align-items: flex-start; justify-content: space-between; }
    .back-spot-name {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
    }
    .back-title {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(255,255,255,0.06);
      padding: 2px 8px;
      border-radius: 20px;
    }
    .crowd-level-wrap { display: flex; align-items: baseline; gap: 10px; }
    .crowd-level-badge {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .crowd-level-LOW    { color: #34d399; }
    .crowd-level-NORMAL { color: #94a3b8; }
    .crowd-level-BUSY   { color: #fb923c; }
    .crowd-level-PACKED { color: #f87171; }
    .crowd-current {
      font-size: 13px;
      color: var(--text-dim);
    }
    .back-section {
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .back-section-label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .back-range {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .back-samples {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .crowd-bar-wrap {
      height: 4px;
      background: rgba(255,255,255,0.07);
      border-radius: 2px;
      margin-top: 7px;
      position: relative;
    }
    .crowd-bar-fill {
      height: 100%;
      border-radius: 2px;
      max-width: 100%;
    }
    .crowd-bar-marker {
      position: absolute;
      top: -3px;
      width: 2px;
      height: 10px;
      background: rgba(255,255,255,0.85);
      border-radius: 1px;
      transform: translateX(-50%);
    }
    .flip-hint {
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
      margin-top: auto;
      padding-top: 4px;
    }
    .back-no-data {
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
    }

    .frame-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      background: var(--surface-2);
    }
    .frame-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 12px;
      letter-spacing: 0.03em;
    }

    .card-body { padding: 18px 20px 20px; }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .spot-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .rating-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .r-EPIC        { background: rgba(251,191,36,0.15);  color: #fbbf24; }
    .r-VERY_GOOD   { background: rgba(52,211,153,0.15);  color: #34d399; }
    .r-GOOD        { background: rgba(52,211,153,0.10);  color: #6ee7b7; }
    .r-FAIR        { background: rgba(251,191,36,0.10);  color: #fcd34d; }
    .r-POOR_TO_FAIR{ background: rgba(251,146,60,0.10);  color: #fb923c; }
    .r-POOR        { background: rgba(248,113,113,0.10); color: #f87171; }

    /* ── Count display ───────────────────────────────────────────────────── */
    .count-row {
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin-bottom: 4px;
    }
    .count-num {
      font-size: 64px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
    }
    .count-num.known    { color: var(--text); }
    .count-num.unknown  { color: var(--text-muted); font-size: 48px; }
    .count-unit {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 400;
    }
    .count-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 18px;
      min-height: 16px;
    }

    /* ── Conditions ──────────────────────────────────────────────────────── */
    .conditions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .cond-label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .cond-value {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
    }
    .cond-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ── Skeleton ────────────────────────────────────────────────────────── */
    .skeleton {
      background: linear-gradient(90deg,
        var(--surface-2) 25%,
        rgba(255,255,255,0.04) 50%,
        var(--surface-2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 5px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Section header ──────────────────────────────────────────────────── */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    /* ── Chart card ──────────────────────────────────────────────────────── */
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px 20px 24px;
    }
    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .chart-title {
      font-size: 13px;
      color: var(--text-dim);
    }

    .range-tabs {
      display: flex;
      gap: 3px;
      background: var(--surface-2);
      border-radius: 8px;
      padding: 3px;
    }
    .range-tab {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 11px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-muted);
      border: none;
      background: transparent;
      transition: all 0.15s;
    }
    .range-tab:hover  { color: var(--text-dim); }
    .range-tab.active { background: var(--surface); color: var(--text); }

    .chart-wrap { position: relative; height: 220px; }

    .no-history {
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="live-dot"></div>
    Surf Crowd Monitor
  </div>
  <div id="lastUpdated">—</div>
</header>

<main>
  <div class="spots-grid" id="spotsGrid">
    <!-- skeleton injected by JS on load -->
  </div>

  <div class="section-label">Surfer Count History</div>
  <div class="chart-card">
    <div class="chart-header">
      <div class="chart-title">All spots — reliable counts only</div>
      <div class="range-tabs">
        <button class="range-tab active" data-hours="24">24 h</button>
        <button class="range-tab" data-hours="72">3 d</button>
        <button class="range-tab" data-hours="168">7 d</button>
      </div>
    </div>
    <div class="chart-wrap">
      <canvas id="historyChart"></canvas>
    </div>
  </div>
</main>

<script>
// ── CONFIG — fill in your Supabase anon (public) key ───────────────────────
const SUPABASE_URL      = 'https://htqizzhtueybtqbwcmiq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0cWl6emh0dWV5YnRxYndjbWlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwNTk5MzQsImV4cCI6MjA4OTYzNTkzNH0.7ezUGo82i6iHs3K9OsPzHuKzgUeENVahI7b_839Dha4';

// Spots and colors are loaded dynamically from spots.json (symlinked to config/spots.json).
// To add a new spot, edit config/spots.json — no dashboard changes needed.
let SPOTS  = [];
const PALETTE = [
  '#38bdf8','#818cf8','#f472b6','#fb923c',
  '#34d399','#a78bfa','#fbbf24','#f87171',
];
let COLORS = {};

async function loadSpots() {
  const res  = await fetch('spots.json');
  const json = await res.json();
  SPOTS  = json.spots
    .filter(s => s.enabled)
    .map(s => ({ id: s.id, name: s.name, surflineId: s.surfline_spot_id }));
  COLORS = Object.fromEntries(
    SPOTS.map((s, i) => [s.id, PALETTE[i % PALETTE.length]])
  );
}

// ── Init Supabase ──────────────────────────────────────────────────────────
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let chart     = null;
let activeHrs = 24;

// ── Helpers ────────────────────────────────────────────────────────────────
function timeAgo(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 90)    return 'just now';
  if (s < 3600)  return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}

function ratingKey(r) {
  return r ? r.replace(/\s+/g, '_').toUpperCase() : '';
}
function ratingLabel(r) {
  return r ? r.replace(/_/g, ' ') : '';
}
function fmt(v, unit, decimals = 0) {
  return v != null ? `${Number(v).toFixed(decimals)}${unit}` : '—';
}
function waveRange(mn, mx) {
  if (mn == null || mx == null) return '—';
  return mn === mx ? `${mn}ft` : `${mn}–${mx}ft`;
}
function degreesToCardinal(deg) {
  if (deg == null) return '';
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg / 22.5) % 16];
}

// ── Skeleton cards ─────────────────────────────────────────────────────────
function renderSkeletons() {
  document.getElementById('spotsGrid').innerHTML = SPOTS.map(() => `
    <div class="spot-card">
      <div class="card-inner">
        <div class="card-front">
          <div class="frame-placeholder skeleton"></div>
          <div class="card-body">
            <div class="card-header">
              <div class="skeleton" style="width:90px;height:11px"></div>
              <div class="skeleton" style="width:38px;height:18px;border-radius:20px"></div>
            </div>
            <div class="skeleton" style="width:72px;height:60px;margin-bottom:6px"></div>
            <div class="skeleton" style="width:110px;height:11px;margin-bottom:18px"></div>
            <div class="conditions">
              ${[0,1,2,3].map(() => `
                <div>
                  <div class="skeleton" style="height:9px;margin-bottom:4px;width:60%"></div>
                  <div class="skeleton" style="height:13px;width:80%"></div>
                </div>`).join('')}
            </div>
          </div>
        </div>
        <div class="card-back">
          <div class="back-no-data" style="margin:auto;text-align:center">Loading…</div>
        </div>
      </div>
    </div>
  `).join('');
}

// ── Render a single card ───────────────────────────────────────────────────
function cardHTML(spot, obs, cond = {}) {
  const count    = obs?.surfer_count;
  const reliable = obs?.count_reliable;
  // Prefer live conditions (cond), fall back to stored DB values (obs)
  const rk       = ratingKey(cond?.spot_rating ?? obs?.spot_rating);

  const frameHTML = obs?.frame_url
    ? `<img class="frame-thumb" src="${obs.frame_url}" alt="${spot.name}" loading="lazy">`
    : `<div class="frame-placeholder">No frame yet</div>`;

  let countHTML, unitHTML, metaHTML;
  if (!obs) {
    countHTML = `<div class="count-num unknown">—</div>`;
    unitHTML  = '';
    metaHTML  = 'No data';
  } else if (count === null || !reliable) {
    countHTML = `<div class="count-num unknown">—</div>`;
    unitHTML  = '';
    metaHTML  = `Unreliable · ${timeAgo(obs.captured_at)}`;
  } else {
    countHTML = `<div class="count-num known">${count}</div>`;
    unitHTML  = `<div class="count-unit">surfers</div>`;
    metaHTML  = `Counted ${timeAgo(obs.captured_at)}`;
  }

  return `
    <div class="spot-card" data-spot-id="${spot.id}">
      <div class="card-inner">
        <div class="card-front">
          ${frameHTML}
          <div class="card-body">
            <div class="card-header">
              <div class="spot-name">${spot.name}</div>
              ${rk ? `<div class="rating-badge r-${rk}">${ratingLabel(cond?.spot_rating ?? obs?.spot_rating)}</div>` : ''}
            </div>
            <div class="count-row">${countHTML}${unitHTML}</div>
            <div class="count-meta">${metaHTML}</div>
            <div class="conditions">
              <div>
                <div class="cond-label">Surf</div>
                <div class="cond-value">${waveRange(
                  cond?.wave_height_min ?? obs?.wave_height_min,
                  cond?.wave_height_max ?? obs?.wave_height_max
                )}</div>
                ${(cond?.surf_human_relation) ? `<div class="cond-sub">${cond.surf_human_relation}</div>` : ''}
              </div>
              <div>
                <div class="cond-label">Swell</div>
                <div class="cond-value">${(() => {
                  const h   = cond?.swell_height      ?? obs?.swell_height;
                  const p   = cond?.swell_period      ?? obs?.swell_period;
                  const dir = degreesToCardinal(cond?.swell_direction ?? obs?.swell_direction);
                  if (h == null || h < 0.1) return '—';
                  return `${Number(h).toFixed(1)}ft${p ? ` @ ${p}s` : ''}${dir ? ` ${dir}` : ''}`;
                })()}</div>
              </div>
              <div>
                <div class="cond-label">Wind</div>
                <div class="cond-value">${(() => {
                  const s   = cond?.wind_speed         ?? obs?.wind_speed;
                  const dir = cond?.wind_direction_type ?? null;
                  if (s == null) return '—';
                  return `${Math.round(s)} kts${dir ? ` · ${dir}` : ''}`;
                })()}</div>
              </div>
              <div>
                <div class="cond-label">Tide</div>
                <div class="cond-value">${fmt(cond?.tide_height ?? obs?.tide_height, 'ft', 1)}</div>
              </div>
            </div>
          </div>
        </div>
        <div class="card-back">
          <div class="back-no-data" style="margin:auto;text-align:center">Loading crowd data…</div>
        </div>
      </div>
    </div>`;
}

// ── Live conditions via Supabase Edge Function (proxies Surfline server-side)
const _CONDITIONS_FN = `${SUPABASE_URL}/functions/v1/conditions`;

async function fetchSpotConditions(surflineId) {
  try {
    const r = await fetch(`${_CONDITIONS_FN}?spotId=${surflineId}`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } catch (e) {
    console.warn('Conditions fetch failed for', surflineId, e);
    return {};
  }
}

// ── Crowd context — historical typical data ────────────────────────────────

const backDataCache = new Map(); // spotId → { rows, loaded }

// Compute percentile stats from an array of numbers
function computeStats(samples) {
  if (samples.length < 5) return null;
  const sorted = [...samples].sort((a, b) => a - b);
  const at = pct => sorted[Math.max(0, Math.floor((pct / 100) * sorted.length) - 1)];
  return {
    count:  samples.length,
    min:    sorted[0],
    max:    sorted[sorted.length - 1],
    p25:    at(25),
    p75:    at(75),
    p90:    at(90),
    mean:   Math.round(samples.reduce((s, v) => s + v, 0) / samples.length),
  };
}

// Fetch last-30-days reliable rows for a spot (cached per spotId)
async function fetchHistoricalRows(spotId) {
  if (backDataCache.has(spotId)) return backDataCache.get(spotId);
  const since = new Date(Date.now() - 30 * 86_400_000).toISOString();
  const { data } = await db
    .from('observations')
    .select('captured_at, surfer_count, spot_rating, wave_height_min')
    .eq('spot_id', spotId)
    .eq('count_reliable', true)
    .not('surfer_count', 'is', null)
    .gte('captured_at', since)
    .order('captured_at', { ascending: false });
  const rows = data || [];
  backDataCache.set(spotId, rows);
  return rows;
}

// Typical crowd for same ±1 hour of day (browser local time)
function typicalByHour(rows, refDate) {
  const refHour = refDate.getHours();
  const matching = rows.filter(r => {
    const h = new Date(r.captured_at).getHours();
    return Math.abs(h - refHour) <= 1 || Math.abs(h - refHour) >= 23; // wrap midnight
  });
  return computeStats(matching.map(r => r.surfer_count));
}

// Typical crowd for same Surfline rating
function typicalByRating(rows, rating) {
  if (!rating) return null;
  const matching = rows.filter(r => r.spot_rating === rating && r.surfer_count != null);
  return computeStats(matching.map(r => r.surfer_count));
}

// Classify current count against a stats object
function classifyLevel(current, stats) {
  if (!stats || current == null) return null;
  if (current <= stats.p25)  return 'LOW';
  if (current <= stats.p75)  return 'NORMAL';
  if (current <= stats.p90)  return 'BUSY';
  return 'PACKED';
}

// Mini horizontal bar: filled to p75, marker at current position
function barHTML(current, stats, color) {
  if (!stats || current == null) return '';
  const maxVal   = Math.max(stats.max, current, 1);
  const fillPct  = Math.min(100, (stats.p75 / maxVal) * 100);
  const markPct  = Math.min(100, (current  / maxVal) * 100);
  return `
    <div class="crowd-bar-wrap">
      <div class="crowd-bar-fill" style="width:${fillPct}%;background:${color}33"></div>
      <div class="crowd-bar-marker" style="left:${markPct}%"></div>
    </div>`;
}

function formatHour(h) {
  const ampm = h < 12 ? 'am' : 'pm';
  const h12  = h % 12 || 12;
  return `${h12}${ampm}`;
}

// Render full back-card HTML
function renderBackHTML(spot, obs, hourStats, condStats) {
  const count    = obs?.surfer_count;
  const rating   = obs?.spot_rating;
  const refHour  = obs?.captured_at ? new Date(obs.captured_at).getHours() : new Date().getHours();

  // Determine primary level badge
  const primaryStats = hourStats || condStats;
  const level  = classifyLevel(count, primaryStats);
  const levelColors = { LOW: '#34d399', NORMAL: '#94a3b8', BUSY: '#fb923c', PACKED: '#f87171' };
  const levelColor  = level ? levelColors[level] : '#94a3b8';

  const badgeHTML = (level && count != null)
    ? `<div class="crowd-level-wrap">
        <div class="crowd-level-badge crowd-level-${level}">${level}</div>
        <div class="crowd-current">Currently ${count} surfer${count !== 1 ? 's' : ''}</div>
       </div>`
    : `<div class="back-no-data">No recent count to compare</div>`;

  // Time-of-day section
  let hourSection = '';
  if (hourStats) {
    hourSection = `
      <div class="back-section">
        <div class="back-section-label">This time of day (${formatHour(Math.max(0, refHour - 1))}–${formatHour(Math.min(23, refHour + 1))})</div>
        <div class="back-range">${hourStats.p25}–${hourStats.p75} surfers typical</div>
        <div class="back-samples">${hourStats.count} sample${hourStats.count !== 1 ? 's' : ''} · last 30 days</div>
        ${barHTML(count, hourStats, levelColor)}
      </div>`;
  } else {
    hourSection = `
      <div class="back-section">
        <div class="back-section-label">This time of day</div>
        <div class="back-no-data">Not enough history yet</div>
      </div>`;
  }

  // Conditions section
  let condSection = '';
  const condLevel = classifyLevel(count, condStats);
  const condColor = condLevel ? levelColors[condLevel] : '#94a3b8';
  if (condStats && rating) {
    condSection = `
      <div class="back-section">
        <div class="back-section-label">Similar conditions (${ratingLabel(rating)} surf)</div>
        <div class="back-range">${condStats.p25}–${condStats.p75} surfers typical</div>
        <div class="back-samples">${condStats.count} sample${condStats.count !== 1 ? 's' : ''} · last 30 days</div>
        ${barHTML(count, condStats, condColor)}
      </div>`;
  } else if (rating) {
    condSection = `
      <div class="back-section">
        <div class="back-section-label">Similar conditions (${ratingLabel(rating)} surf)</div>
        <div class="back-no-data">Not enough history yet</div>
      </div>`;
  }

  return `
    <div class="back-header">
      <div class="back-spot-name">${spot.name}</div>
      <div class="back-title">Crowd Context</div>
    </div>
    ${badgeHTML}
    ${hourSection}
    ${condSection}
    <div class="flip-hint">↩ Tap to flip back</div>`;
}

// Populate back face on first flip
async function ensureBackLoaded(cardEl) {
  const back = cardEl.querySelector('.card-back');
  if (back.dataset.loaded) return;

  const spotId = cardEl.dataset.spotId;
  const spot   = SPOTS.find(s => s.id === spotId);
  if (!spot) return;

  // Find the latest obs stored on the card (we stash it as a data attribute)
  let obs = null;
  try { obs = JSON.parse(cardEl.dataset.obs || 'null'); } catch (_) {}

  try {
    const rows     = await fetchHistoricalRows(spotId);
    const refDate  = obs?.captured_at ? new Date(obs.captured_at) : new Date();
    const rating   = obs?.spot_rating ?? null;
    const hourStats = typicalByHour(rows, refDate);
    const condStats = typicalByRating(rows, rating);
    back.innerHTML  = renderBackHTML(spot, obs, hourStats, condStats);
  } catch (e) {
    console.warn('Back card load failed', e);
    back.innerHTML = `<div class="back-no-data" style="margin:auto;text-align:center">Could not load crowd data</div>`;
  }
  back.dataset.loaded = '1';
}

// ── Fetch latest observation per spot ─────────────────────────────────────
async function fetchLatest() {
  const results = await Promise.all(
    SPOTS.map(async spot => {
      const [{ data }, cond] = await Promise.all([
        db
          .from('observations')
          .select('*')
          .eq('spot_id', spot.id)
          .order('captured_at', { ascending: false })
          .limit(1)
          .maybeSingle(),
        fetchSpotConditions(spot.surflineId),
      ]);
      return { spot, obs: data, cond };
    })
  );

  document.getElementById('spotsGrid').innerHTML =
    results.map(({ spot, obs, cond }) => cardHTML(spot, obs, cond)).join('');

  // Stash obs on each card element so the back-card loader can read it
  results.forEach(({ spot, obs }) => {
    const el = document.querySelector(`.spot-card[data-spot-id="${spot.id}"]`);
    if (el && obs) {
      el.dataset.obs = JSON.stringify(obs);
      // Invalidate cached back so it re-renders on next flip with fresh obs
      const back = el.querySelector('.card-back');
      if (back) delete back.dataset.loaded;
    }
  });

  document.getElementById('lastUpdated').textContent =
    `Updated ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
}

// ── History chart ──────────────────────────────────────────────────────────
async function fetchAndRenderHistory(hours) {
  const since = new Date(Date.now() - hours * 3600_000).toISOString();

  const allData = await Promise.all(
    SPOTS.map(async spot => {
      const { data } = await db
        .from('observations')
        .select('captured_at, surfer_count')
        .eq('spot_id', spot.id)
        .eq('count_reliable', true)
        .not('surfer_count', 'is', null)
        .gte('captured_at', since)
        .order('captured_at', { ascending: true });
      return { spot, data: data || [] };
    })
  );

  const datasets = allData
    .filter(({ data }) => data.length > 0)
    .map(({ spot, data }) => ({
      label:           spot.name,
      data:            data.map(d => ({ x: new Date(d.captured_at), y: d.surfer_count })),
      borderColor:     COLORS[spot.id],
      backgroundColor: COLORS[spot.id] + '18',
      borderWidth:     2,
      pointRadius:     3,
      pointHoverRadius:5,
      tension:         0.35,
      fill:            false,
    }));

  const chartWrap = document.querySelector('.chart-wrap');

  if (datasets.length === 0) {
    chartWrap.innerHTML = `<div class="no-history">No reliable counts yet in this window</div>`;
    return;
  }

  if (!chartWrap.querySelector('canvas')) {
    chartWrap.innerHTML = `<canvas id="historyChart"></canvas>`;
  }

  if (chart) {
    chart.data.datasets = datasets;
    chart.update();
    return;
  }

  chart = new Chart(
    document.getElementById('historyChart').getContext('2d'),
    {
      type: 'line',
      data: { datasets },
      options: {
        responsive:          true,
        maintainAspectRatio: false,
        interaction:         { mode: 'nearest', intersect: false },
        plugins: {
          legend: {
            position: 'bottom',
            labels: {
              color:          '#64748b',
              font:           { family: 'Inter', size: 11 },
              boxWidth:       8,
              boxHeight:      8,
              usePointStyle:  true,
              pointStyle:     'circle',
              padding:        16,
            },
          },
          tooltip: {
            backgroundColor: '#0d1625',
            borderColor:     'rgba(255,255,255,0.08)',
            borderWidth:     1,
            titleColor:      '#94a3b8',
            bodyColor:       '#e2e8f0',
            titleFont:       { family: 'Inter', size: 11 },
            bodyFont:        { family: 'Inter', size: 12 },
            callbacks: {
              title: items => new Date(items[0].parsed.x)
                .toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }),
              label: item  => ` ${item.dataset.label}: ${item.parsed.y} surfers`,
            },
          },
        },
        scales: {
          x: {
            type:  'time',
            time:  { unit: hours <= 24 ? 'hour' : 'day' },
            grid:  { color: 'rgba(255,255,255,0.04)' },
            ticks: { color: '#475569', font: { family: 'Inter', size: 10 } },
          },
          y: {
            beginAtZero: true,
            grid:        { color: 'rgba(255,255,255,0.04)' },
            ticks:       { color: '#475569', font: { family: 'Inter', size: 10 }, stepSize: 5 },
            title:       { display: true, text: 'Surfers', color: '#475569', font: { family: 'Inter', size: 10 } },
          },
        },
      },
    }
  );
}

// ── Range tab switcher ─────────────────────────────────────────────────────
document.querySelectorAll('.range-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.range-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeHrs = parseInt(btn.dataset.hours);
    fetchAndRenderHistory(activeHrs);
  });
});

// ── Flip card event delegation ─────────────────────────────────────────────
function setupFlipHandler() {
  document.getElementById('spotsGrid').addEventListener('click', async e => {
    const card = e.target.closest('.spot-card[data-spot-id]');
    if (!card) return;
    card.classList.toggle('flipped');
    if (card.classList.contains('flipped')) {
      await ensureBackLoaded(card);
    }
  });
}

// ── Boot ───────────────────────────────────────────────────────────────────
async function init() {
  await loadSpots();
  renderSkeletons();
  setupFlipHandler();
  await Promise.all([fetchLatest(), fetchAndRenderHistory(activeHrs)]);
}

init();
setInterval(fetchLatest, 5 * 60 * 1000); // auto-refresh cards every 5 min
</script>
